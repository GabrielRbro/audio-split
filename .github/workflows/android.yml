name: Android checks and debug APKs

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: android-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v3
      - name: Install Android SDK
        run: sdkmanager 'platforms;android-36' 'build-tools;36.0.0'
      - uses: gradle/actions/setup-gradle@v4
      - name: Verify and assemble
        run: ./gradlew :core:test :app:testDebugUnitTest :app:lintDebug :tone-player:lintBluetoothDebug :tone-player:lintPhoneDebug :app:assembleDebug :tone-player:assembleBluetoothDebug :tone-player:assemblePhoneDebug
      - uses: actions/upload-artifact@v4
        with:
          name: audio-split-debug
          path: |
            app/build/outputs/apk/debug/*.apk
            tone-player/build/outputs/apk/*/debug/*.apk
            **/build/reports/tests/
            **/build/reports/lint-results-*.html
          if-no-files-found: error
          retention-days: 14
      - name: Preserve check reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: android-check-reports
          path: |
            **/build/reports/tests/
            **/build/reports/lint-results-*.html
          if-no-files-found: ignore
          retention-days: 14
